[project]
authors = [{name = "Kapdap", email = "kapdap@proton.me"}]
classifiers = [
  "Environment :: Plugins",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Games/Entertainment",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = []
description = "Import Resident Evil: Code: Veronica room data files (.rdx/.rdt)"
keywords = ["blender", "resident-evil", "code-veronica", "rdx", "rdt", "importer"]
license = {text = "MIT"}
name = "io_scene_biocv"
readme = "README.md"
requires-python = ">=3.11"
urls = {Homepage = "https://github.com/kapdap/re-cvx-blender"}
version = "0.4.0"

[dependency-groups]
dev = ["commit-and-tag-version>=1.0.1", "ruff>=0.17.0"]

[tool.commit-and-tag-version]
bump_files = ["pyproject.toml", {filename = "src/io_scene_biocv/blender_manifest.toml", type = "python"}]
package_files = ["pyproject.toml"]
releaseCommitMessageFormat = "chore(release): v{{currentTag}}"
tag_prefix = "v"

[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/io_scene_biocv/operators.py" = ["RUF012"]

[tool.pyright]
reportInvalidTypeForm = false
