name: Build test

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      Addon_Name: io_scene_biocv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Build Blender addon
        id: build
        run: python build.py -a ${{ env.Addon_Name }}
